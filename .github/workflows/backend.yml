name: Backend CI

on:
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Django Checks & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements/development.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements/development.txt

      - name: Run Django system check
        run: |
          python backend/manage.py check --settings=config.settings.testing

      - name: Check for uncreated migrations
        run: |
          python backend/manage.py makemigrations --check --dry-run --settings=config.settings.testing

      - name: Run backend test suite
        run: |
          python backend/manage.py test apps --settings=config.settings.testing -v 2
