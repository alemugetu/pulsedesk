          description: UUID of the role to assign. Send null to remove the role.
    PatchedNotification:
      type: object
      description: Serializer for notification list and detail views.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        organization:
          type: string
          format: uuid
          readOnly: true
          description: Organization that owns this notification.
        recipient:
          type: string
          format: uuid
          readOnly: true
          description: User who should receive this notification.
        notification_type:
          allOf:
          - $ref: '#/components/schemas/NotificationTypeEnum'
          readOnly: true
          description: |-
            Type of notification event.

            * `SLA_WARNING` - SLA Warning
            * `SLA_BREACH` - SLA Breach
            * `ESCALATION_TRIGGERED` - Escalation Triggered
        title:
          type: string
          readOnly: true
          description: Notification title.
        message:
          type: string
          readOnly: true
          description: Detailed notification message.
        severity:
          allOf:
          - $ref: '#/components/schemas/SeverityEnum'
          readOnly: true
          description: |-
            Severity level of the notification.

            * `INFO` - Info
            * `WARNING` - Warning
            * `CRITICAL` - Critical
        incident_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: Related incident ID if applicable.
        escalation_event_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
          description: Related escalation event ID if applicable.
        is_read:
          type: boolean
          description: Whether the notification has been read.
        read_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Timestamp when the notification was marked as read.
        created_at:
          type: string
          format: date-time
          readOnly: true
    PatchedNotificationPreferenceUpdate:
      type: object
      description: Serializer for updating notification preferences.
      properties:
        email_enabled:
          type: boolean
          description: Whether email notifications are enabled.
        in_app_enabled:
          type: boolean
          description: Whether in-app notifications are enabled.
    PatchedRoleUpdate:
      type: object
      description: Write serializer for updating a custom role.
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 1000
        permissions:
          type: array
          items:
            type: string
          nullable: true
          description: Full replacement list of permission codenames. Omit to leave
            unchanged.
    PatchedSLAPolicyUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 2000
        is_active:
          type: boolean
        is_default:
          type: boolean
    PatchedSLATargetUpdate:
      type: object
      properties:
        response_time_minutes:
          type: integer
          minimum: 1
        resolution_time_minutes:
          type: integer
          minimum: 1
    PriorityDistribution:
      type: object
      properties:
        low:
          type: integer
        medium:
          type: integer
        high:
          type: integer
        critical:
          type: integer
      required:
      - critical
      - high
      - low
      - medium
    PriorityEnum:
      enum:
      - P1
      - P2
      - P3
      - P4
      type: string
      description: |-
        * `P1` - P1 — Critical
        * `P2` - P2 — High
        * `P3` - P3 — Medium
        * `P4` - P4 — Low
    ResendVerification:
      type: object
      description: Serializer for resending verification email.
      properties:
        email:
          type: string
          format: email
      required:
      - email
    Role:
      type: object
      description: Read serializer for roles — exposes permission codenames.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
          readOnly: true
        is_system_role:
          type: boolean
          readOnly: true
          description: System roles are seeded automatically and cannot be deleted.
        permissions:
          type: array
          items:
            type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - description
      - id
      - is_system_role
      - name
      - permissions
      - slug
      - updated_at
    RoleCreate:
      type: object
      description: Write serializer for creating a custom role.
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          default: ''
          maxLength: 1000
        permissions:
          type: array
          items:
            type: string
          description: List of permission codenames to attach to this role.
      required:
      - name
    SLAMetrics:
      type: object
      properties:
        healthy:
          type: integer
        approaching:
          type: integer
        breached:
          type: integer
        resolved_within_sla:
          type: integer
        response_breaches:
          type: integer
        resolution_breaches:
          type: integer
      required:
      - approaching
      - breached
      - healthy
      - resolution_breaches
      - resolved_within_sla
      - response_breaches
    SLAPolicy:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        is_default:
          type: boolean
          readOnly: true
          description: Only one active policy per organization may be the default.
            Enforced by a partial unique index.
        targets:
          type: array
          items:
            $ref: '#/components/schemas/SLATarget'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - description
      - id
      - is_active
      - is_default
      - name
      - targets
      - updated_at
    SLAPolicyCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          default: ''
          maxLength: 2000
        is_active:
          type: boolean
          default: true
        is_default:
          type: boolean
          default: false
      required:
      - name
    SLATarget:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        priority:
          allOf:
          - $ref: '#/components/schemas/PriorityEnum'
          readOnly: true
        response_time_minutes:
          type: integer
          readOnly: true
          description: Minutes until the incident must be acknowledged.
        resolution_time_minutes:
          type: integer
          readOnly: true
          description: Minutes until the incident must be resolved.
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - priority
      - resolution_time_minutes
      - response_time_minutes
      - updated_at
    SLATargetCreate:
      type: object
      properties:
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        response_time_minutes:
          type: integer
          minimum: 1
        resolution_time_minutes:
          type: integer
          minimum: 1
      required:
      - priority
      - resolution_time_minutes
      - response_time_minutes
    SeverityEnum:
      enum:
      - INFO
      - WARNING
      - CRITICAL
      type: string
      description: |-
        * `INFO` - Info
        * `WARNING` - Warning
        * `CRITICAL` - Critical
    StatusD64Enum:
      enum:
      - OPEN
      - ACKNOWLEDGED
      - IN_PROGRESS
      - RESOLVED
      - CLOSED
      type: string
      description: |-
        * `OPEN` - Open
        * `ACKNOWLEDGED` - Acknowledged
        * `IN_PROGRESS` - In Progress
        * `RESOLVED` - Resolved
        * `CLOSED` - Closed
    TargetTypeEnum:
      enum:
      - ASSIGNEE
      - ROLE
      type: string
      description: |-
        * `ASSIGNEE` - Assigned Agent
        * `ROLE` - Organization Role
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TriggerTypeEnum:
      enum:
      - RESPONSE_BREACH
      - RESOLUTION_BREACH
      type: string
      description: |-
        * `RESPONSE_BREACH` - Response SLA Breach
        * `RESOLUTION_BREACH` - Resolution SLA Breach
    UserLogin:
      type: object
      description: Serializer for user login.
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - email
      - password
    UserProfile:
      type: object
      description: Serializer for the authenticated user profile.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        is_verified:
          type: boolean
          readOnly: true
      required:
      - email
      - first_name
      - id
      - is_active
      - is_verified
      - last_name
    UserRegistration:
      type: object
      description: Serializer for user registration.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          writeOnly: true
        password_confirm:
          type: string
          writeOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
      required:
      - email
      - id
      - password
      - password_confirm
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
servers:
- url: /
  description: Current server
