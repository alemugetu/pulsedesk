          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        assignee:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        sla:
          type: object
          additionalProperties: {}
          nullable: true
          description: |-
            Return embedded SLA summary or None if no SLA record exists.
            Uses hasattr / try-except to safely handle missing reverse relation.
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
