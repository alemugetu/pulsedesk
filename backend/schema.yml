      type: object
      description: |-
        Full incident representation including embedded SLA summary.

        The `sla` field is None when no SLA policy was configured at incident
        creation time (graceful degradation).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        incident_number:
          type: string
          readOnly: true
        title:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusD64Enum'
          readOnly: true
        priority:
          allOf:
          - $ref: '#/components/schemas/PriorityEnum'
          readOnly: true
