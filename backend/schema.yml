components:
  schemas:
    Comment:
      type: object
      description: |-
        Serializer for Comment model.

        Includes author information and mentioned users.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        incident:
          type: string
          format: uuid
          readOnly: true
        author:
          type: object
          additionalProperties: {}
          description: Return author information.
          readOnly: true
        body:
          type: string
        is_internal:
          type: boolean
          description: Internal notes are only visible to organization members.
        mentioned_users:
          type: array
          items:
            $ref: '#/components/schemas/MentionedUser'
          readOnly: true
        is_owner:
          type: boolean
          description: Return whether the current user is the comment author.
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - body
      - created_at
      - id
      - incident
      - is_owner
      - mentioned_users
      - updated_at
