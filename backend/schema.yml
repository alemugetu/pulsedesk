openapi: 3.0.3
info:
  title: PulseDesk API
  version: 1.0.0
  description: PulseDesk is a multi-tenant incident and escalation operations platform.
    This API provides authentication, organization management, and membership operations.
    All protected endpoints require a Bearer JWT in the Authorization header.
  contact:
    name: PulseDesk Engineering
paths:
  /api/v1/:
    get:
      operationId: v1_retrieve
      description: Returns the API name, version, and links to major endpoint groups.
      summary: API root
      tags:
      - Health
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: API root information.
  /api/v1/health/:
    get:
      operationId: v1_health_retrieve
      description: Returns the operational status of the PulseDesk API. No authentication
        is required. Suitable for load-balancer health probes.
      summary: Health check
      tags:
      - Health
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: API is healthy.
  /api/v1/health/dependencies/:
    get:
      operationId: v1_health_dependencies_retrieve
      description: Reports the health of external infrastructure dependencies such
        as Redis. This endpoint is separate from the main application health check
        so that a temporary Redis outage does not incorrectly mark the API as entirely
        down.
      summary: Dependency health check
      tags:
      - Health
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: All checked dependencies are healthy.
        '503':
          description: One or more dependencies are unhealthy.
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      description: Creates a new user account and sends a verification email. User
        must verify their email before logging in. This endpoint is public — no authentication
        required.
      summary: Register a new user
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistration'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '201':
          description: User created successfully. Verification email sent.
        '400':
          description: Validation error — invalid input or email already registered.
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: Authenticates a user by email and password and returns JWT tokens.
        This endpoint is public — no authentication required.
      summary: Login
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          description: Login successful. Returns access and refresh tokens.
        '401':
          description: Authentication failed — invalid credentials or inactive account.
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      description: Blacklists the provided refresh token, preventing it from being
        used to generate new access tokens. The access token remains valid until its
        natural expiry — clients must discard it locally. **Requires authentication.**
      summary: Logout
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Logout'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: Logout successful.
        '400':
          description: Invalid or already-blacklisted refresh token.
        '401':
          description: Authentication credentials not provided.
  /api/v1/auth/token/refresh/:
    post:
      operationId: v1_auth_token_refresh_create
      description: Exchanges a valid refresh token for a new access token (and a new
        refresh token when ROTATE_REFRESH_TOKENS is enabled). The old refresh token
        is blacklisted after rotation. This endpoint is public — no authentication
        required.
      summary: Refresh access token
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          description: New tokens issued.
        '401':
          description: Refresh token is invalid or expired.
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      description: Returns the profile of the currently authenticated user. **Requires
        authentication.**
      summary: Get authenticated user profile
      tags:
      - Authentication
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
        '401':
          description: Authentication credentials not provided.
  /api/v1/auth/verify-email/:
    get:
      operationId: v1_auth_verify_email_retrieve
      description: Handles email verification when a user clicks the link in the verification
        email. The token is passed as a query parameter. Returns a plain JSON confirmation
        — no redirect, no frontend required.
      summary: Verify email via link (GET)
      parameters:
      - in: query
        name: token
        schema:
          type: string
        description: Secure verification token from the email link.
        required: true
      tags:
      - Authentication
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          description: Email verified successfully.
        '400':
          description: Invalid or expired token.
    post:
      operationId: v1_auth_verify_email_create
      description: Verifies a user's email address using a secure token. Use this
        when submitting the token programmatically. This endpoint is public — no authentication
        required.
      summary: Verify email via POST (API clients / Swagger)
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerification'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          description: Email verified successfully.
        '400':
          description: Invalid or expired token.
  /api/v1/auth/resend-verification/:
    post:
      operationId: v1_auth_resend_verification_create
      description: Resends a verification email to the user. For security, returns
        a generic response regardless of whether the email exists. This endpoint is
        public — no authentication required.
      summary: Resend verification email
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerification'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          description: If the email exists and is unverified, a verification email
            will be sent.
        '400':
          description: Invalid email format.
  /api/v1/auth/password-reset/request/:
    post:
      operationId: v1_auth_password_reset_request_create
      description: Sends a password reset email to the user. For security, returns
        a generic response regardless of whether the email exists. This endpoint is
        public — no authentication required.
      summary: Request password reset
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          description: If the email exists, a password reset email will be sent.
        '400':
          description: Invalid email format.
  /api/v1/auth/password-reset/confirm/:
    get:
      operationId: v1_auth_password_reset_confirm_retrieve
      description: Called when a user clicks the reset link in the email. Validates
        the token and returns the token + user_id to use in the POST body to complete
        the reset.
      summary: Password reset confirm — validate link (GET)
      parameters:
      - in: query
        name: token
        schema:
          type: string
        description: Password reset token from the email link.
        required: true
      - in: query
        name: user_id
        schema:
          type: string
        description: User UUID from the email link.
        required: true
      tags:
      - Authentication
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          description: Token is valid. Use the POST endpoint to set a new password.
        '400':
          description: Invalid or expired token.
    post:
      operationId: v1_auth_password_reset_confirm_create
      description: Resets the user's password using a secure token sent via email.
        This endpoint is public — no authentication required.
      summary: Confirm password reset (POST)
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          description: Password reset successfully.
        '400':
          description: Invalid token, expired token, or invalid password.
  /api/v1/organizations/:
    get:
      operationId: v1_organizations_list
      description: |
        Returns all active organizations where the authenticated user has an active membership.

        **Requires authentication.**


        ## How to become Organization Owner

        **The creator of an organization is automatically assigned the
        Organization Owner role.** No manual step required.

        **Quick-start workflow:**

        1. `POST /api/v1/auth/register/` — create your account.
        2. Click **Authorize** in Swagger and enter your access token.
        3. `POST /api/v1/organizations/` with `{"name": "My Company"}`.
        4. You are now the owner. Your membership already has the Owner role.
        5. `GET /api/v1/organizations/{id}/members/` — confirm your role is
           `organization-owner`.
        6. `GET /api/v1/organizations/{id}/roles/` — view all 5 system roles
           and their permission sets.
      summary: List my organizations
      tags:
      - Organizations
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'
              examples:
                OrganizationList:
                  value:
                  - - id: 018f1a2b-0001-7000-0000-000000000001
                      name: Acme Corp
                      slug: acme-corp
                      status: ACTIVE
                      created_at: '2026-01-01T09:00:00Z'
                      updated_at: '2026-01-01T09:00:00Z'
                  summary: Organization list
          description: ''
        '401':
          description: Authentication credentials not provided.
    post:
      operationId: v1_organizations_create
      description: |
        Creates a new organization. The authenticated user is **automatically assigned the Organization Owner role** — no extra step needed.

        Five system roles are seeded for the organization at creation time:
        - Organization Owner
        - Organization Admin
        - Operations Manager
        - Agent
        - Viewer

        **Requires authentication.**


        ## Role & Permission Matrix

        Every organization is automatically seeded with 5 system roles when it is
        created. System roles cannot be deleted or renamed.

        | Role | Permissions |
        |---|---|
        | **Organization Owner** | All permissions. Full control. Only one owner per org unless explicitly transferred. |
        | **Organization Admin** | `organization.view`, `organization.update`, `member.view`, `member.invite`, `member.remove`, `member.suspend`, `role.view`, `role.manage`, `role.assign` |
        | **Operations Manager** | `organization.view`, `member.view`, `member.invite`, `member.remove`, `member.suspend`, `role.view`, `role.assign` |
        | **Agent** | `organization.view`, `member.view`, `role.view` |
        | **Viewer** | `organization.view`, `member.view`, `role.view` |

        Custom roles can be created with any subset of the permissions above.
      summary: Create organization (caller becomes Owner)
      tags:
      - Organizations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationCreate'
            examples:
              CreateRequest:
                value:
                  name: Acme Corp
                summary: Create request
              CreateWithCustomSlug:
                value:
                  name: Acme Corp
                  slug: acme
                summary: Create with custom slug
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
              examples:
                CreatedOrganization:
                  value:
                    id: 018f1a2b-0001-7000-0000-000000000001
                    name: Acme Corp
                    slug: acme-corp
                    status: ACTIVE
                    created_at: '2026-01-01T09:00:00Z'
                    updated_at: '2026-01-01T09:00:00Z'
                  summary: Created organization
          description: ''
        '400':
          description: Validation error — missing name or invalid slug.
        '401':
          description: Authentication credentials not provided.
  /api/v1/organizations/{organization_id}/:
    get:
      operationId: v1_organizations_retrieve
      description: |-
        Returns the details of a single organization.

        **Requires authentication and active membership.**

        Returns 404 for organizations the user does not belong to (to prevent organization enumeration).
      summary: Retrieve organization
      parameters:
      - in: path
        name: organization_id
        schema:
          type: string
        description: UUID of the organization.
        required: true
      tags:
      - Organizations
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
          description: ''
        '401':
          description: Authentication credentials not provided.
        '403':
          description: Membership is suspended or removed.
        '404':
          description: Organization not found or user is not a member.
  /api/v1/organizations/{organization_id}/members/:
    get:
      operationId: v1_organizations_members_list
      description: |-
        Returns all active members of the specified organization, including each member's assigned role and permissions.

        **Required permission: `member.view`**

        All roles except Viewer and Agent have this permission by default.

        The response includes a `role` object on each membership showing the role name and its full permission list.
      summary: List organization members
      parameters:
      - in: path
        name: organization_id
        schema:
          type: string
        description: UUID of the organization.
        required: true
      tags:
      - Memberships
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Membership'
              examples:
                MemberListWithRoles:
                  value:
                  - - id: 018f1a2b-0002-7000-0000-000000000001
                      user:
                        id: 018f1a2b-0000-7000-0000-000000000001
                        email: alice@example.com
                        first_name: Alice
                        last_name: Smith
                      role:
                        id: 018f1a2b-0003-7000-0000-000000000001
                        name: Organization Owner
                        slug: organization-owner
                        description: Full control over the organization.
                        is_system_role: true
                        permissions:
                        - member.invite
                        - member.remove
                        - member.suspend
                        - member.view
                        - organization.update
                        - organization.view
                        - role.assign
                        - role.manage
                        - role.view
                        created_at: '2026-01-01T09:00:00Z'
                        updated_at: '2026-01-01T09:00:00Z'
                      status: ACTIVE
                      created_at: '2026-01-01T09:00:00Z'
                      updated_at: '2026-01-01T09:00:00Z'
                  summary: Member list with roles
          description: ''
        '401':
          description: Authentication credentials not provided.
        '403':
          description: Membership suspended/removed, no role assigned, or missing
            `member.view` permission.
        '404':
          description: Organization not found or user is not a member.
  /api/v1/organizations/{organization_id}/members/{membership_id}/role/:
    patch:
      operationId: v1_organizations_members_role_partial_update
      description: |-
        Assigns a role to an organization member, or removes their role by sending `null`.

        **Required permission: `role.assign`**

        Security rules enforced:
        - The role must belong to **this** organization. Cross-tenant roles are rejected (400 `cross_tenant_role`).
        - Only the current **Organization Owner** can assign the owner role to someone else (403 `owner_escalation` otherwise).
        - The **sole owner** cannot remove their own owner role without first transferring ownership (403 `sole_owner_protected`).


        ## Ownership transfer rules

        - Only the current owner can assign the `organization-owner` role to
          another member.
        - An owner cannot remove their own owner role if they are the **sole**
          owner (returns 403 `sole_owner_protected`).
        - To transfer: assign `organization-owner` to another member first,
          then optionally downgrade yourself.


        **How to transfer ownership:**
        1. Find the target member's `membership_id` via `GET /api/v1/organizations/{id}/members/`.
        2. Find the owner role `id` via `GET /api/v1/organizations/{id}/roles/` (slug: `organization-owner`).
        3. `PATCH` this endpoint with the target membership and owner role id.
        4. Optionally downgrade yourself to Admin or another role.
      summary: Assign (or remove) role on a membership
      parameters:
      - in: path
        name: membership_id
        schema:
          type: string
        description: UUID of the membership.
        required: true
      - in: path
        name: organization_id
        schema:
          type: string
        description: UUID of the organization.
        required: true
      tags:
      - Memberships
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMembershipRoleAssign'
            examples:
              AssignARole:
                value:
                  role_id: 018f0001-0000-7000-0000-000000000005
                summary: Assign a role
              RemoveRole(setToNull):
                value:
                  role_id: null
                summary: Remove role (set to null)
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
          description: ''
        '400':
          description: Validation error or cross-tenant role.
        '403':
          description: Missing permission or ownership protection triggered.
        '404':
          description: Membership not found in this organization.
  /api/v1/organizations/{organization_id}/roles/:
    get:
      operationId: v1_organizations_roles_list
      description: |
        Returns all roles in the organization — both system roles (seeded automatically) and any custom roles created by admins.

        Each role includes its full permission list.

        **Required permission: `role.view`**


        ## Role & Permission Matrix

        Every organization is automatically seeded with 5 system roles when it is
        created. System roles cannot be deleted or renamed.

        | Role | Permissions |
        |---|---|
        | **Organization Owner** | All permissions. Full control. Only one owner per org unless explicitly transferred. |
        | **Organization Admin** | `organization.view`, `organization.update`, `member.view`, `member.invite`, `member.remove`, `member.suspend`, `role.view`, `role.manage`, `role.assign` |
        | **Operations Manager** | `organization.view`, `member.view`, `member.invite`, `member.remove`, `member.suspend`, `role.view`, `role.assign` |
        | **Agent** | `organization.view`, `member.view`, `role.view` |
        | **Viewer** | `organization.view`, `member.view`, `role.view` |

        Custom roles can be created with any subset of the permissions above.
      summary: List roles
      parameters:
      - in: path
        name: organization_id
        schema:
          type: string
        description: UUID of the organization.
        required: true
      tags:
      - Roles
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
              examples:
                SystemRolesResponse:
                  value:
                  - - id: 018f0001-0000-7000-0000-000000000001
                      name: Organization Owner
                      slug: organization-owner
                      description: Full control over the organization.
                      is_system_role: true
                      permissions:
                      - member.invite
                      - member.remove
                      - member.suspend
                      - member.view
                      - organization.update
                      - organization.view
                      - role.assign
                      - role.manage
                      - role.view
                      created_at: '2026-01-01T09:00:00Z'
                      updated_at: '2026-01-01T09:00:00Z'
                    - id: 018f0001-0000-7000-0000-000000000005
                      name: Viewer
                      slug: viewer
                      description: Read-only access to organization, members, and
                        roles.
                      is_system_role: true
                      permissions:
                      - member.view
                      - organization.view
                      - role.view
                      created_at: '2026-01-01T09:00:00Z'
                      updated_at: '2026-01-01T09:00:00Z'
                  summary: System roles response
          description: ''
        '401':
          description: Not authenticated.
        '403':
          description: Missing `role.view` permission or inactive membership.
        '404':
          description: Organization not found.
    post:
      operationId: v1_organizations_roles_create
      description: |-
        Creates a new custom role in the organization with a chosen set of permissions.

        **Required permission: `role.manage`** (Owner and Admin only)

        Rules:
        - Role name must be unique within the organization.
        - Permissions must be valid codenames from the permission list.
        - Custom roles have `is_system_role: false` and can be deleted.
        - System roles (`is_system_role: true`) are created automatically and cannot be modified via this endpoint.

        **Available permission codenames:**
        `organization.view`, `organization.update`, `member.view`, `member.invite`, `member.remove`, `member.suspend`, `role.view`, `role.manage`, `role.assign`
      summary: Create custom role
      parameters:
      - in: path
        name: organization_id
        schema:
          type: string
        description: UUID of the organization.
        required: true
      tags:
      - Roles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreate'
            examples:
              CreateRoleRequest:
                value:
                  name: Support Lead
                  description: Handles member onboarding and role assignment.
                  permissions:
                  - member.view
                  - member.invite
                  - role.view
                  - role.assign
                summary: Create role request
        required: true
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
              examples:
                CreatedRoleResponse:
                  value:
                    id: 018f0099-0000-7000-0000-000000000001
                    name: Support Lead
                    slug: support-lead
                    description: Handles member onboarding and role assignment.
                    is_system_role: false
                    permissions:
                    - member.invite
                    - member.view
                    - role.assign
                    - role.view
                    created_at: '2026-01-01T10:00:00Z'
                    updated_at: '2026-01-01T10:00:00Z'
                  summary: Created role response
          description: ''
        '400':
          description: Validation error — duplicate name or unknown permissions.
        '403':
          description: Missing `role.manage` permission.
        '404':
          description: Organization not found.
  /api/v1/organizations/{organization_id}/roles/{role_id}/:
    get:
      operationId: v1_organizations_roles_retrieve
      description: |-
        Returns a single role with its full permission list.

        **Required permission: `role.view`**
      summary: Retrieve role
      parameters:
      - in: path
        name: organization_id
        schema:
          type: string
        description: UUID of the organization.
        required: true
      - in: path
        name: role_id
        schema:
          type: string
        description: UUID of the role.
        required: true
      tags:
      - Roles
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
          description: ''
        '403':
          description: Missing `role.view` permission.
        '404':
          description: Role not found in this organization.
    patch:
      operationId: v1_organizations_roles_partial_update
      description: |-
        Partially updates a custom role's name, description, or permission set.

        **Required permission: `role.manage`** (Owner and Admin only)

        Restrictions:
        - System roles (`is_system_role: true`) **cannot** be modified. Returns 400 `system_role_protected`.
        - `permissions` field replaces the entire permission set when provided. Omit it to leave permissions unchanged.
        - Role name must remain unique within the organization.
      summary: Update custom role
      parameters:
      - in: path
        name: organization_id
        schema:
          type: string
        description: UUID of the organization.
        required: true
      - in: path
        name: role_id
        schema:
          type: string
        description: UUID of the role.
        required: true
      tags:
      - Roles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRoleUpdate'
            examples:
              UpdateNameOnly:
                value:
                  name: Support Manager
                summary: Update name only
              ReplacePermissions:
                value:
                  permissions:
                  - member.view
                  - role.view
                summary: Replace permissions
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
          description: ''
        '400':
          description: Validation error or attempt to modify a system role.
        '403':
          description: Missing `role.manage` permission.
        '404':
          description: Role not found.
    delete:
      operationId: v1_organizations_roles_destroy
      description: |-
        Permanently deletes a custom role.

        **Required permission: `role.manage`** (Owner and Admin only)

        Restrictions:
        - System roles (`is_system_role: true`) **cannot** be deleted. Returns 403 `system_role_protected`.
        - Memberships that held this role will have their role set to `null` (Django `SET_NULL` behavior).
      summary: Delete custom role
      parameters:
      - in: path
        name: organization_id
        schema:
          type: string
        description: UUID of the organization.
        required: true
      - in: path
        name: role_id
        schema:
          type: string
        description: UUID of the role.
        required: true
      tags:
      - Roles
      security:
      - jwtAuth: []
      - BearerAuth: []
      responses:
        '204':
          description: Role deleted successfully.
        '403':
          description: Missing permission or attempt to delete a system role.
        '404':
          description: Role not found.
